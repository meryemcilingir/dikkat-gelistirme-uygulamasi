<div class="exam-home">
    <div class="bg-blob blob-1"></div>
    <div class="bg-blob blob-2"></div>
    <div class="bg-blob blob-3"></div>

    <div class="topbar">
        <div class="topbar-brand">
            <span class="brand-mark">DG</span>
            <span class="brand-name">Dikkat Geliştirme</span>
        </div>
        <button class="logout-btn" (click)="logout()">Çıkış Yap</button>
    </div>

    <ng-container *ngIf="!loading()">
        <!-- ── Dashboard: "Sınavlarım" tek kart ── -->
        <div class="dashboard-wrap" *ngIf="!showInfo()">
            <h1 class="greeting">Merhaba {{ firstName }}!</h1>
            <h2 class="section-title">Sınavlarım</h2>

            <button class="exam-card" (click)="openInfo()">
                <span class="exam-card-icon">📝</span>
                <span class="exam-card-body">
                    <span class="exam-card-title">Dikkat Geliştirme Testi</span>
                    <span class="exam-card-status" [class]="status()">{{ statusLabel }}</span>
                    <div class="progress-wrap" *ngIf="status() === 'InProgress'">
                        <div class="progress-bar"><div class="progress-fill" [style.width.%]="progressPct"></div></div>
                        <span class="progress-label">Soru {{ currentIndex() }} / {{ total() }}</span>
                    </div>
                </span>
                <span class="exam-card-arrow">→</span>
            </button>
        </div>

        <!-- ── Sınava girmeden önce bilgi kartı ── -->
        <div class="info-card" *ngIf="showInfo()">
            <button class="back-link" (click)="closeInfo()">← Geri</button>
            <span class="info-emoji">🧠</span>
            <h1>Dikkat Geliştirme Testi</h1>
            <ul class="info-list">
                <li>Toplam {{ total() }} soru var.</li>
                <li>Her soruyu dikkatlice oku ve işaretle — cevabın otomatik kaydedilip bir sonrakine geçer.</li>
                <li>Bir kez işaretledikten sonra geri dönüp değiştiremezsin.</li>
            </ul>
            <button class="big-btn" (click)="start()">
                <span *ngIf="status() === 'Assigned'">Başla</span>
                <span *ngIf="status() === 'InProgress'">Devam Et</span>
            </button>
        </div>
    </ng-container>
</div>
