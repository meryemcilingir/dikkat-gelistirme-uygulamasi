<div class="cp-backdrop" [class.portal-modal]="auth.currentUser()?.role !== 'student'" *ngIf="auth.changePasswordOpen()" (click)="cancel()">
    <div class="cp-card" (click)="$event.stopPropagation()">
        <h2>Şifremi Değiştir</h2>

        <ng-container *ngIf="!success(); else doneTpl">
            <form (ngSubmit)="submit()" class="cp-form">
                <label>
                    Mevcut Şifre
                    <input type="password" name="currentPassword" [(ngModel)]="currentPassword" autocomplete="current-password" />
                </label>
                <label>
                    Yeni Şifre
                    <input type="password" name="newPassword" [(ngModel)]="newPassword" autocomplete="new-password" [maxlength]="limits.password.max" />
                </label>
                <label>
                    Yeni Şifre Tekrar
                    <input type="password" name="confirmPassword" [(ngModel)]="confirmPassword" autocomplete="new-password" [maxlength]="limits.password.max" />
                </label>

                <div class="error" *ngIf="error()">{{ error() }}</div>

                <div class="actions">
                    <button type="button" class="btn cancel" (click)="cancel()">İptal</button>
                    <button type="submit" class="btn confirm" [disabled]="saving()">
                        {{ saving() ? 'Kaydediliyor...' : 'Şifreyi Değiştir' }}
                    </button>
                </div>
            </form>
        </ng-container>

        <ng-template #doneTpl>
            <p class="success-msg">Şifreniz başarıyla değiştirildi.</p>
            <button type="button" class="btn confirm" (click)="cancel()">Tamam</button>
        </ng-template>
    </div>
</div>
