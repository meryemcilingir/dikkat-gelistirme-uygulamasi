<div class="page-frame">

        <div class="frame-top">
        <app-activity-header icons="🏔️" instruction="Hangi dağın görüntüsü diğerlerinden farklıdır?"></app-activity-header>
    </div>

    <div class="frame-middle">

        <button class="nav-btn" (click)="goPrev()" aria-label="Önceki etkinlik">
            <span class="material-icons">arrow_back</span>
        </button>

        <div class="game-content">
            <div class="interaction-card">
                <div class="mountain-grid">
                    @for (mtn of options; track mtn.id) {
                    <div class="mountain-card" [class.selected]="selectedId === mtn.id" [class.shake]="mtn.isShaking"
                        [class.hint]="showHint && mtn.isDifferent && feedbackState !== 'correct'"
                        (click)="selectMountain(mtn.id)">

                        <div class="mountain-scene" [class.mirrored]="mtn.isDifferent">
                            <div class="peak peak-back"></div>
                            <div class="peak peak-front"></div>
                            <div class="ground"></div>
                        </div>

                        <div class="checkbox" [class.selected]="selectedId === mtn.id">
                            @if (selectedId === mtn.id) {
                            <span class="material-icons check-icon">check</span>
                            }
                        </div>
                    </div>
                    }
                </div>
            </div>
        </div>

        <button class="nav-btn" [class.locked]="!isNextUnlocked" [disabled]="!isNextUnlocked" (click)="goNext()"
            aria-label="Sonraki etkinlik">
            <span class="material-icons">arrow_forward</span>
        </button>

    </div>

    <div class="frame-bottom">
        <app-action-buttons [isCompleted]="isNextUnlocked" (reset)="clearSelection()" (check)="checkAnswer()" />
    </div>

</div>
