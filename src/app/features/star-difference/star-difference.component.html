<div class="page-frame">
    <div class="frame-top">
        <app-activity-header icons="⭐"
            instruction="Diğerlerinden biraz farklı olan yıldızları bul ve tıkla."></app-activity-header>
    </div>

    <div class="frame-middle">
        <button class="nav-btn" (click)="goPrev()" aria-label="Önceki etkinlik">
            <span class="material-icons">arrow_back</span>
        </button>

        <div class="game-content">
            <div class="grid">
                @for (c of cells; track c.id) {
                <button class="cell"
                    [class.selected]="c.isSelected"
                    [disabled]="isSubmitted"
                    (click)="onCellClick(c)">
                    <svg viewBox="-50 -50 100 100" class="star"
                        [style.transform]="'rotate(' + c.rotation + 'deg)'">
                        <g [attr.transform]="'scale(' + c.scale + ')'">
                            <polygon
                                [attr.points]="getStarPoints(c.innerRadius)"
                                [attr.fill]="c.fillColor"
                                stroke="#B8860B"
                                stroke-width="2"
                                stroke-linejoin="round" />
                        </g>
                    </svg>
                    @if (c.isSelected) {
                    <span class="check">✓</span>
                    }
                </button>
                }
            </div>
        </div>

        <button class="nav-btn" [class.locked]="!isSubmitted" [disabled]="!isSubmitted" (click)="goNext()"
            aria-label="Sonraki etkinlik">
            <span class="material-icons">arrow_forward</span>
        </button>
    </div>

    <div class="frame-bottom">
        <app-action-buttons [isCompleted]="isSubmitted" (reset)="clearSelection()" (check)="checkAnswer()" />
    </div>
</div>
