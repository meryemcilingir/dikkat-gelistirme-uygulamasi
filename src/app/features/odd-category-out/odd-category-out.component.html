<div class="page-frame">

    <div class="frame-top">
        <app-activity-header icons="🧩"
            instruction="Aşağıdakilerden hangisi diğerleriyle aynı gruba girmez? İşaretleyin.">
        </app-activity-header>
    </div>

    <div class="frame-middle">

        <button class="nav-btn" (click)="goPrev()" aria-label="Önceki etkinlik">
            <span class="material-icons">arrow_back</span>
        </button>

        <div class="game-content">
            <div class="questions-list">

                @for (q of questions; track q.id) {
                <div class="question-block">
                    <div class="question-row">
                        @for (item of q.items; track item.id) {
                        <button class="item-card"
                            [class.selected]="isSelected(q, item)"
                            [class.correct]="isCorrect(q, item)"
                            [class.wrong]="isWrong(q, item)"
                            [class.hint]="showHint && item.isOdd && feedbackState !== 'correct'"
                            (click)="select(q, item)"
                            [attr.aria-label]="item.name + ' seç'"
                            [attr.aria-pressed]="isSelected(q, item)">
                            <span class="item-emoji">{{ item.emoji }}</span>
                            <span class="item-name">{{ item.name }}</span>
                        </button>
                        }
                    </div>
                </div>
                }

            </div>
        </div>

        <button class="nav-btn" [class.locked]="!isNextUnlocked" [disabled]="!isNextUnlocked"
            (click)="goNext()" aria-label="Sonraki etkinlik">
            <span class="material-icons">arrow_forward</span>
        </button>

    </div>

    <div class="frame-bottom">
        <app-action-buttons [isCompleted]="isNextUnlocked" (reset)="clearAll()" (check)="checkAnswers()" />
    </div>

</div>
