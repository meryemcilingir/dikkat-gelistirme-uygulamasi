<div class="page-frame">
    <div class="frame-top">
        <app-activity-header icons="" instruction="Hangi iki top birbiriyle aynıdır? Renk ve desene göre eşleştirin.">
        </app-activity-header>
    </div>

    <div class="frame-middle">
        <button class="nav-btn" (click)="goPrev()" aria-label="Önceki etkinlik">
            <span class="material-icons">arrow_back</span>
        </button>

        <div class="game-content">
            <div class="balls-grid">
                @for (ball of balls; track ball.id) {
                <div class="ball-wrapper" [class.selected]="ball.isSelected" [class.matched]="ball.isMatched"
                    [class.wrong]="ball.isWrong" [class.hint]="isHint(ball)" (click)="onBallClick(ball.id)">

                    <svg viewBox="0 0 90 90" class="ball-svg" xmlns="http://www.w3.org/2000/svg">
                        <!-- Ball body -->
                        <circle cx="45" cy="45" r="43" [attr.fill]="ball.color" stroke="rgba(0,0,0,0.12)"
                            stroke-width="1.5" />

                        <!-- Seam: left C-curve -->
                        <path d="M 24,5 C -4,30 -4,60 24,85" fill="none" stroke="rgba(255,255,255,0.45)"
                            stroke-width="3" stroke-linecap="round" />

                        <!-- Seam: right C-curve -->
                        <path d="M 66,5 C 94,30 94,60 66,85" fill="none" stroke="rgba(255,255,255,0.45)"
                            stroke-width="3" stroke-linecap="round" />

                        <!-- Highlight glint -->
                        <ellipse cx="32" cy="26" rx="13" ry="9" fill="rgba(255,255,255,0.20)" />

                        <!-- Symbols in center -->
                        <text x="45" y="50" text-anchor="middle" dominant-baseline="middle"
                            [attr.font-size]="getSymbolFontSize(ball.symbols)" font-family="serif" font-weight="bold"
                            fill="rgba(45,45,45,1)" letter-spacing="1">
                            {{ getSymbolText(ball.symbols) }}
                        </text>
                    </svg>
                </div>
                }
            </div>
        </div>

        <button class="nav-btn" [class.locked]="!isNextUnlocked" [disabled]="!isNextUnlocked" (click)="goNext()"
            aria-label="Sonraki etkinlik">
            <span class="material-icons">arrow_forward</span>
        </button>
    </div>

    <div class="frame-bottom">
        <app-action-buttons [isCompleted]="isNextUnlocked" (reset)="clearSelection()" (check)="checkAnswer()" />
    </div>
</div>
