<div class="page-frame">
    <div class="frame-top">
        <app-activity-header icons="" instruction="Şekillerin eşini aşağıda bulun ve seçin.">
        </app-activity-header>
    </div>

    <div class="frame-middle">
        <button class="nav-btn" (click)="goPrev()" aria-label="Önceki etkinlik">
            <span class="material-icons">arrow_back</span>
        </button>

        <div class="game-content">
            <div class="board">

                <!-- ÜST: 5 referans şekil -->
                <div class="ref-row">
                    @for (col of columns; track col.colId) {
                    <div class="ref-cell">
                        <ng-container *ngTemplateOutlet="shapeTpl; context: { v: col.ref, sz: 'lg' }"></ng-container>
                    </div>
                    }
                </div>

                <div class="divider"></div>

                <!-- ALT: 4 satır × 5 sütun seçenek -->
                @for (rowIdx of [0,1,2,3]; track rowIdx) {
                <div class="option-row">
                    @for (col of columns; track col.colId) {
                    <div class="option-cell hover" [class.selected]="col.selectedId === col.options[rowIdx].id"
                        [class.shake]="col.options[rowIdx].isShaking" [class.hint]="isHint(col, col.options[rowIdx])"
                        (click)="selectOption(col, col.options[rowIdx].id)">
                        <ng-container
                            *ngTemplateOutlet="shapeTpl; context: { v: col.options[rowIdx].variant, sz: 'md' }"></ng-container>
                    </div>
                    }
                </div>
                }

            </div>
        </div>

        <button class="nav-btn" [class.locked]="!isNextUnlocked" [disabled]="!isNextUnlocked" (click)="goNext()"
            aria-label="Sonraki etkinlik">
            <span class="material-icons">arrow_forward</span>
        </button>
    </div>

    <div class="frame-bottom">
        <app-action-buttons [isCompleted]="isNextUnlocked" (reset)="clearSelection()" (check)="checkAnswer()" />
    </div>
</div>

<!-- ════════════════════════════════════════════════════════════
     SVG Şekil Template — variant isimleriyle eşleşir
     ════════════════════════════════════════════════════════════ -->
<ng-template #shapeTpl let-v="v" let-sz="sz">
    <svg [class]="'sv ' + sz" [attr.viewBox]="'0 0 64 56'" xmlns="http://www.w3.org/2000/svg">

        @switch (v) {

        <!-- ─── 1. PAC-CIRCLE ─────────────────────────────── -->
        @case ('pac-circle') {
        <!-- Pembe daire + mor üçgen sağ -->
        <circle cx="22" cy="28" r="18" fill="#e05c7a" />
        <polygon points="36,28 56,16 56,40" fill="#6b3fa0" />
        }
        @case ('pac-circle-vert') {
        <!-- Dikey iki pembe daire + mor üçgen aşağı -->
        <circle cx="32" cy="14" r="11" fill="#e88ca0" />
        <circle cx="32" cy="32" r="11" fill="#e88ca0" />
        <polygon points="32,46 22,56 42,56" fill="#5a3090" />
        }
        @case ('pac-circle-left') {
        <!-- Pembe daire + mor üçgen sol (aynalı) -->
        <circle cx="42" cy="28" r="18" fill="#e88ca0" />
        <polygon points="28,28 8,16 8,40" fill="#6b3fa0" />
        }
        @case ('big-triangle') {
        <!-- Büyük koyu pembe üçgen -->
        <polygon points="32,4 60,52 4,52" fill="#c04060" />
        }

        <!-- ─── 2. GREEN-X-SQUARE ─────────────────────────── -->
        @case ('green-x-square') {
        <!-- Yeşil kare + X -->
        <rect x="10" y="6" width="44" height="44" fill="#4a9e6b" stroke="#2d6e47" stroke-width="2" />
        <line x1="10" y1="6" x2="54" y2="50" stroke="#2d6e47" stroke-width="3" />
        <line x1="54" y1="6" x2="10" y2="50" stroke="#2d6e47" stroke-width="3" />
        }
        @case ('green-z') {
        <!-- Yeşil Z harfi -->
        <text x="32" y="44" text-anchor="middle" font-size="48" font-weight="bold" fill="#4a9e6b"
            font-family="sans-serif">Z</text>
        }
        @case ('green-bowtie') {
        <!-- Yeşil bowtie / kum saati X -->
        <polygon points="12,8 52,28 12,48" fill="#5a8e5b" stroke="#3a6e3b" stroke-width="2" />
        <polygon points="52,8 12,28 52,48" fill="#5a8e5b" stroke="#3a6e3b" stroke-width="2" />
        }
        @case ('green-bowtie-2') {
        <!-- Küçük yeşil bowtie -->
        <polygon points="14,12 50,28 14,44" fill="#6aae6b" stroke="#3a6e3b" stroke-width="2" />
        <polygon points="50,12 14,28 50,44" fill="#6aae6b" stroke="#3a6e3b" stroke-width="2" />
        }

        <!-- ─── 3. PURPLE-HEX ────────────────────────────── -->
        @case ('purple-hex-x') {
        <!-- Mor altıgen + X çizgiler (doğru) -->
        <polygon points="32,4 56,16 56,40 32,52 8,40 8,16" fill="#8b6abf" stroke="#5e3d99" stroke-width="2" />
        <line x1="8" y1="16" x2="56" y2="40" stroke="#5e3d99" stroke-width="2.5" />
        <line x1="56" y1="16" x2="8" y2="40" stroke="#5e3d99" stroke-width="2.5" />
        <line x1="32" y1="4" x2="32" y2="52" stroke="#5e3d99" stroke-width="2.5" />
        }
        @case ('purple-hex') {
        <!-- Mor altıgen X yok -->
        <polygon points="32,4 56,16 56,40 32,52 8,40 8,16" fill="#8b6abf" stroke="#5e3d99" stroke-width="2" />
        }
        @case ('purple-cube') {
        <!-- Mor 3D küp -->
        <polygon points="32,6 56,18 56,40 32,52 8,40 8,18" fill="#9b7acf" />
        <polygon points="32,6 56,18 32,30 8,18" fill="#b09adf" />
        <line x1="32" y1="30" x2="32" y2="52" stroke="#6a4a9f" stroke-width="1.5" />
        <line x1="32" y1="30" x2="56" y2="18" stroke="#6a4a9f" stroke-width="1.5" />
        <line x1="32" y1="30" x2="8" y2="18" stroke="#6a4a9f" stroke-width="1.5" />
        }
        @case ('purple-cube-2') {
        <!-- Mor 3D kutu (büyük) -->
        <polygon points="32,2 58,16 58,42 32,56 6,42 6,16" fill="#7b5aaf" />
        <polygon points="32,2 58,16 32,30 6,16" fill="#a08acf" />
        <line x1="32" y1="30" x2="32" y2="56" stroke="#5a3a8f" stroke-width="2" />
        }

        <!-- ─── 4. WATERMELON ─────────────────────────────── -->
        @case ('watermelon') {
        <!-- Karpuz dilimi (doğru) -->
        <polygon points="32,6 58,50 6,50" fill="#3a7d44" />
        <polygon points="32,14 52,48 12,48" fill="#e8504a" />
        <polygon points="32,10 55,49 9,49" fill="none" stroke="#c8e6c9" stroke-width="3" />
        }
        @case ('watermelon-orange') {
        <!-- Turuncu üçgen (yanlış renk) -->
        <polygon points="32,6 58,50 6,50" fill="#e89050" />
        <polygon points="32,14 52,48 12,48" fill="#f0c080" />
        }
        @case ('watermelon-tall') {
        <!-- Uzun ince karpuz -->
        <polygon points="32,2 48,54 16,54" fill="#3a7d44" />
        <polygon points="32,12 44,52 20,52" fill="#e8504a" />
        }
        @case ('watermelon-rect') {
        <!-- Koyu arka plan + pembe üçgen -->
        <rect x="8" y="8" width="48" height="40" rx="4" fill="#4a3060" />
        <polygon points="32,14 50,44 14,44" fill="#e88ca0" />
        }

        <!-- ─── 5. DARK-CIRCLE ────────────────────────────── -->
        @case ('dark-circle-green') {
        <!-- Koyu kırmızı daire + yeşil kare arka plan (doğru) -->
        <rect x="8" y="6" width="48" height="44" rx="4" fill="#8bc48a" />
        <circle cx="32" cy="28" r="17" fill="#9b2c2c" />
        }
        @case ('dark-circle-plain') {
        <!-- Koyu kırmızı daire arka plansız -->
        <circle cx="32" cy="28" r="20" fill="#9b2c2c" />
        }
        @case ('dark-circle-big') {
        <!-- Büyük açık kırmızı daire -->
        <circle cx="32" cy="28" r="22" fill="#d04040" />
        }
        @case ('dark-circle-pedestal') {
        <!-- Daire + sarı kaide -->
        <rect x="16" y="38" width="32" height="14" rx="3" fill="#e8b040" />
        <circle cx="32" cy="24" r="16" fill="#c03838" />
        }

        }
    </svg>
</ng-template>
