<div class="page-frame">

  <!-- ÜSTTE: ActivityHeader bileşeni -->
  <div class="frame-top">
    <app-activity-header
      [instruction]="'Meyvenin değerini bulunuz.'"
      [icons]="'🍉'">
    </app-activity-header>
  </div>

  <!-- ORTADA: Oyun içeriği + navigasyon okları -->
  <div class="frame-middle">
    <button class="nav-btn" (click)="prev()">&#9664;</button>

    <div class="game-content">
      <div class="math-container">
        <!-- Equation Display -->
        <div class="equation-card">
          <span class="num">2</span>
          <span class="operator">+</span>
          <span class="symbol">🍉</span>
          <span class="operator">=</span>
          <span class="num">8</span>
        </div>

        <div class="instruction-sub">🍉 = ?</div>

        <!-- Options Grid -->
        <div class="options-grid">
          @for (option of options; track option.value) {
            <div class="option-card"
                 [class.selected]="option.isSelected"
                 [class.locked]="isCompleted"
                 (click)="selectOption(option.value)">
              {{ option.value }}
            </div>
          }
        </div>
      </div>
    </div>

    <button class="nav-btn" [class.locked]="!isCompleted" (click)="next()">&#9654;</button>
  </div>

  <!-- ALTTA: ActionButtons bileşeni -->
  <div class="frame-bottom">
    <app-action-buttons
      [isCompleted]="isCompleted"
      [checkAlwaysDisabled]="checkAlwaysDisabled"
      (reset)="onReset()"
      (check)="onCheck()">
    </app-action-buttons>
  </div>

</div>

<!-- Feedback popup — her sayfada olmalı -->
<app-shared-feedback></app-shared-feedback>
