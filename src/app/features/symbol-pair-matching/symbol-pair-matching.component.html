<div class="page-frame">

  <div class="frame-top">
    <app-activity-header
      [instruction]="'Aynı olan sembolleri eşleştirin.'"
      [icons]="'🧩'">
    </app-activity-header>
  </div>

  <div class="frame-middle">
    <button class="nav-btn" (click)="prev()">&#9664;</button>

    <div class="game-content">
      <div class="symbol-grid">
        @for (card of cards; track card.id) {
          <div class="symbol-card"
               [class.selected]="card.isSelected"
               [class.matched]="card.isPaired"
               (click)="selectCard(card.id)">
            <div class="card-front">
              <div class="symbol-icon" [style.color]="card.color">{{ card.symbol }}</div>
            </div>
            @if (card.isPaired && card.pairIndex !== null) {
              <div class="pair-badge" [style.background]="pairBadgeColor(card)">{{ card.pairIndex! + 1 }}</div>
            }
          </div>
        }
      </div>
    </div>

    <button class="nav-btn" [class.locked]="!isSubmitted" (click)="next()">&#9654;</button>
  </div>

  <div class="frame-bottom">
    <app-action-buttons
      [isCompleted]="isSubmitted"
      (reset)="onReset()"
      (check)="checkAnswer()">
    </app-action-buttons>
  </div>

</div>

<app-shared-feedback></app-shared-feedback>
