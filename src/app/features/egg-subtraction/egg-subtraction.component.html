<div class="page-frame">

  <div class="frame-top">
    <app-activity-header
      [instruction]="'5 yumurtadan 2 tanesi kırılıyor. Kaç yumurta kalır?'"
      [icons]="'🥚🐣'">
    </app-activity-header>
  </div>

  <div class="frame-middle">
    <button class="nav-btn" (click)="prev()">&#9664;</button>

    <div class="game-content">
      <div class="egg-layout">

        <!-- Equation visual -->
        <div class="equation-area">
          <div class="egg-row">
            @for (egg of eggs; track egg.id) {
              <div class="egg-wrapper" [class.broken]="egg.broken">
                @if (!egg.broken) {
                  <svg viewBox="0 0 60 80" class="egg-svg">
                    <ellipse cx="30" cy="45" rx="22" ry="30" fill="#FFECD2" stroke="#D4A373" stroke-width="2"/>
                    <ellipse cx="30" cy="42" rx="18" ry="26" fill="#FFF3E0" opacity="0.5"/>
                  </svg>
                } @else {
                  <svg viewBox="0 0 60 80" class="egg-svg broken-egg">
                    <!-- Broken shell bottom -->
                    <path d="M10 50 Q 12 35 20 30 L 25 38 L 30 28 L 35 36 L 40 30 Q 48 35 50 50 Q 50 75 30 78 Q 10 75 10 50Z"
                          fill="#FFECD2" stroke="#D4A373" stroke-width="2"/>
                    <!-- Crack lines -->
                    <line x1="20" y1="30" x2="25" y2="38" stroke="#D4A373" stroke-width="1.5"/>
                    <line x1="25" y1="38" x2="30" y2="28" stroke="#D4A373" stroke-width="1.5"/>
                    <line x1="30" y1="28" x2="35" y2="36" stroke="#D4A373" stroke-width="1.5"/>
                    <line x1="35" y1="36" x2="40" y2="30" stroke="#D4A373" stroke-width="1.5"/>
                    <!-- X mark -->
                    <line x1="18" y1="55" x2="42" y2="70" stroke="#ef4444" stroke-width="3" opacity="0.6"/>
                    <line x1="42" y1="55" x2="18" y2="70" stroke="#ef4444" stroke-width="3" opacity="0.6"/>
                  </svg>
                }
              </div>
            }
          </div>

          <div class="equation-text">
            <span class="eq-num">{{ totalEggs }}</span>
            <span class="eq-op">−</span>
            <span class="eq-num">{{ brokenEggs }}</span>
            <span class="eq-op">=</span>
            <span class="eq-num answer-box">{{ selectedAnswer ?? '?' }}</span>
          </div>
        </div>

        <!-- Answer options -->
        <div class="answer-options">
          @for (opt of options; track opt) {
            <button class="answer-btn"
                    [class.selected]="selectedAnswer === opt"
                    [class.correct]="isCompleted && opt === correctAnswer"
                    (click)="selectOption(opt)">
              {{ opt }}
            </button>
          }
        </div>

      </div>
    </div>

    <button class="nav-btn" [class.locked]="!isCompleted" (click)="next()">&#9654;</button>
  </div>

  <div class="frame-bottom">
    <app-action-buttons
      [isCompleted]="isCompleted"
      (reset)="onReset()"
      (check)="onCheck()">
    </app-action-buttons>
  </div>

</div>

<app-shared-feedback></app-shared-feedback>
