<div class="page-frame">
    <div class="frame-top">
        <app-activity-header icons="🧩"
            instruction="Her satırda ve sütunda her şekil bir kez bulunuyor. Soru işaretinin yerine hangi şekil gelmelidir?">
        </app-activity-header>
    </div>

    <div class="frame-middle">
        <button class="nav-btn" (click)="goPrev()" aria-label="Önceki etkinlik">
            <span class="material-icons">arrow_back</span>
        </button>

        <div class="game-content">

            <!-- 3×3 Matris -->
            <div class="matrix">
                @for (row of grid; track $index; let r = $index) {
                    @for (cell of row; track $index; let c = $index) {
                        <div class="matrix-cell"
                            [class.missing]="r === missingRow && c === missingCol"
                            [class.preview]="r === missingRow && c === missingCol && selectedShape !== null">
                            @if (r === missingRow && c === missingCol) {
                                @if (selectedShape !== null) {
                                    <ng-container *ngTemplateOutlet="shapeTpl; context: { s: selectedShape }"></ng-container>
                                } @else {
                                    <span class="q-mark">?</span>
                                }
                            } @else {
                                <ng-container *ngTemplateOutlet="shapeTpl; context: { s: cell }"></ng-container>
                            }
                        </div>
                    }
                }
            </div>

            <!-- Seçenekler -->
            <div class="options-row">
                @for (opt of options; track opt.id) {
                <button class="option-btn hover"
                    [class.selected]="selectedId === opt.id"
                    [class.shake]="opt.isShaking"
                    [class.hint]="showHint && opt.isCorrect && selectedId === null"
                    [class.rotated]="opt.rotated"
                    [disabled]="isNextUnlocked"
                    (click)="selectOption(opt.id)"
                    [attr.aria-label]="'Seçenek ' + opt.id"
                    [attr.aria-pressed]="selectedId === opt.id">
                    <ng-container *ngTemplateOutlet="shapeTpl; context: { s: opt.shape }"></ng-container>
                </button>
                }
            </div>
        </div>

        <button class="nav-btn" [class.locked]="!isNextUnlocked" [disabled]="!isNextUnlocked" (click)="goNext()"
            aria-label="Sonraki etkinlik">
            <span class="material-icons">arrow_forward</span>
        </button>
    </div>

    <div class="frame-bottom">
        <app-action-buttons [isCompleted]="isNextUnlocked" (reset)="clearSelection()" (check)="checkAnswer()" />
    </div>
</div>

<!-- Şekil SVG template -->
<ng-template #shapeTpl let-s="s">
    <svg viewBox="0 0 40 40" class="shape-svg" xmlns="http://www.w3.org/2000/svg">
        @switch (s) {
        @case ('circle') {
            <circle cx="20" cy="20" r="15" fill="#5c6bc0" stroke="#283593" stroke-width="2"/>
        }
        @case ('square') {
            <rect x="6" y="6" width="28" height="28" rx="3" fill="#ef5350" stroke="#b71c1c" stroke-width="2"/>
        }
        @case ('triangle') {
            <polygon points="20,5 37,34 3,34" fill="#43a047" stroke="#1b5e20" stroke-width="2" stroke-linejoin="round"/>
        }
        }
    </svg>
</ng-template>
