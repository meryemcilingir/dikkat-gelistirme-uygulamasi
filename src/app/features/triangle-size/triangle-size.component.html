<div class="page-frame">

    <div class="frame-top">
    <app-activity-header icons="🧠 💡 🧩" instruction="En büyük ve en küçük üçgeni bulup altındaki kutucuğa onay işareti koyun."></app-activity-header>
  </div>

  <div class="frame-middle">

        <button class="nav-btn" (click)="goPrev()" aria-label="Önceki etkinlik">
            <span class="material-icons">arrow_back</span>
        </button>

        <div class="game-content">
            <div class="interaction-card">
                <div class="triangles-container">
                    @for (triangle of triangles; track triangle.id; let i = $index) {
                    <div class="triangle-item">
                        <div class="triangle-wrapper" [style.height.px]="140">
                            <svg [attr.width]="triangle.size" [attr.height]="triangle.size" viewBox="0 0 100 100"
                                class="triangle-svg">
                                <polygon points="50,5 95,95 5,95" />
                            </svg>
                        </div>
                        <div class="selection-card" [class.selected]="triangle.selected" (click)="toggleSelection(i)">
                            <div class="checkbox" [class.selected]="triangle.selected" [class.hint-add]="isHintAdd(i)"
                                [class.hint-remove]="isHintRemove(i)">
                                @if (triangle.selected) {
                                <span class="material-icons check-icon">check</span>
                                }
                            </div>
                        </div>
                    </div>
                    }
                </div>
            </div>
        </div>

        <button class="nav-btn" [class.locked]="!isNextUnlocked" [disabled]="!isNextUnlocked" (click)="goNext()"
            [attr.aria-label]="isNextUnlocked ? 'Sonraki etkinlik' : 'Önce en büyük ve en küçük üçgeni doğru işaretlemelisiniz'">
            <span class="material-icons">arrow_forward</span>
        </button>

    </div>

    <div class="frame-bottom">
        <app-action-buttons [isCompleted]="isNextUnlocked" (reset)="clearAll()" (check)="checkAnswers()" />
    </div>

</div>
