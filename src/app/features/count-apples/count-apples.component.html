<div class="page-frame">
    <div class="frame-top">
        <app-activity-header icons=""
            instruction="Her kutucuğun içindeki elmaları sayın ve örnekteki gibi yazın.">
        </app-activity-header>
    </div>

    <div class="frame-middle">
        <button class="nav-btn" (click)="goPrev()" aria-label="Önceki etkinlik">
            <span class="material-icons">arrow_back</span>
        </button>

        <div class="game-content">
            <div class="boxes-grid">

                <!-- Örnek kutu (sabit, 2 elma = 2) -->
                <div class="apple-box example">
                    <div class="apples-side">
                        <span class="apple">🍎</span>
                        <span class="apple">🍎</span>
                    </div>
                    <div class="answer-side example-answer">
                        <span class="example-num">2</span>
                    </div>
                </div>

                <!-- Sorular -->
                @for (box of boxes; track box.id) {
                <div class="apple-box" [class.correct]="box.isCorrect === true">
                    <div class="apples-side">
                        @for (i of getAppleArray(box.count); track i) {
                        <span class="apple">🍎</span>
                        }
                    </div>
                    <div class="answer-side">
                        <div class="input-wrapper">
                            @if (showHint && box.isCorrect !== true) {
                            <span class="ghost-answer">{{ box.count }}</span>
                            }
                            <input
                                type="text"
                                inputmode="numeric"
                                pattern="[0-9]*"
                                maxlength="2"
                                class="count-input"
                                [class.shake]="box.isShaking"
                                [class.input-correct]="box.isCorrect === true"
                                [class.input-wrong]="box.isCorrect === false"
                                [(ngModel)]="box.userInput"
                                (ngModelChange)="onInput()"
                                [disabled]="isNextUnlocked"
                                [placeholder]="showHint ? '' : '?'" />
                        </div>
                    </div>
                </div>
                }

            </div>
        </div>

        <button class="nav-btn" [class.locked]="!isNextUnlocked" [disabled]="!isNextUnlocked"
            (click)="goNext()" aria-label="Sonraki etkinlik">
            <span class="material-icons">arrow_forward</span>
        </button>
    </div>

    <div class="frame-bottom">
        <app-action-buttons [isCompleted]="isNextUnlocked" (reset)="clearSelection()" (check)="checkAnswer()" />
    </div>
</div>
