<div class="page-frame">

    <div class="frame-top">
        <app-activity-header icons="🎨" instruction="Sayılara bakarak uygun rengi seçin ve kutuları boyayın."></app-activity-header>
    </div>

    <div class="frame-middle">

        <button class="nav-btn" (click)="prev()" aria-label="Önceki etkinlik">
            <span class="material-icons">arrow_back</span>
        </button>

        <div class="game-content">
            <div class="color-layout">
                
                <!-- Palette -->
                <div class="palette-container">
                    @for (pal of palette; track pal.id) {
                        <div class="palette-item" 
                             [class.selected]="selectedColorId === pal.id"
                             [style.background-color]="pal.color"
                             (click)="selectColor(pal.id)">
                            <span class="palette-number">{{ pal.id }}</span>
                        </div>
                    }
                </div>

                <!-- Grids -->
                <div class="grids-container">
                    
                    <!-- Grid 1 -->
                    <div class="paint-grid">
                        @for (cell of grid1; track cell.id) {
                            <div class="paint-cell"
                                 [style.background-color]="getColorHex(cell.userColorId)"
                                 [class.hint-error]="isHintPulse(cell)"
                                 (click)="paintCell(cell)">
                                <span class="cell-number" [class.painted]="cell.userColorId !== null">{{ cell.targetColorId }}</span>
                            </div>
                        }
                    </div>

                    <!-- Grid 2 -->
                    <div class="paint-grid">
                        @for (cell of grid2; track cell.id) {
                            <div class="paint-cell"
                                 [style.background-color]="getColorHex(cell.userColorId)"
                                 [class.hint-error]="isHintPulse(cell)"
                                 (click)="paintCell(cell)">
                                <span class="cell-number" [class.painted]="cell.userColorId !== null">{{ cell.targetColorId }}</span>
                            </div>
                        }
                    </div>

                </div>

            </div>
        </div>

        <button class="nav-btn" [class.locked]="!isNextUnlocked" [disabled]="!isNextUnlocked" (click)="next()"
            aria-label="Sonraki etkinlik">
            <span class="material-icons">arrow_forward</span>
        </button>

    </div>

    <div class="frame-bottom">
        <app-action-buttons [isCompleted]="isNextUnlocked" (reset)="onReset()" (check)="onCheck()" />
    </div>

</div>

<app-shared-feedback></app-shared-feedback>
