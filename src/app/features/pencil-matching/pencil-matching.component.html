<div class="page-frame">
    <div class="frame-top">
        <app-activity-header icons="" instruction="Aynı uzunluktaki kalemleri eşleştirin."></app-activity-header>
    </div>

    <div class="frame-middle">
        <button class="nav-btn" (click)="goPrev()" aria-label="Önceki etkinlik">
            <span class="material-icons">arrow_back</span>
        </button>

        <div class="game-content">
            <div class="match-container">

                <!-- Left column: pencils face right -->
                <div class="pencil-col left-col">
                    @for (pencil of leftPencils; track $index) {
                    <div class="pencil-slot"
                        [class.selected]="pencil.isSelected"
                        [class.matched]="pencil.isPaired"
                        (click)="selectLeft($index)">
                        <div [class]="'pencil pencil-' + pencil.color + ' size-' + pencil.size">
                            <div class="p-eraser"></div>
                            <div class="p-band"></div>
                            <div class="p-body"></div>
                            <div class="p-point"></div>
                        </div>
                    </div>
                    }
                </div>

                <!-- SVG overlay for connection lines and anchor dots -->
                <svg class="lines-svg"
                    [attr.width]="CONTAINER_WIDTH"
                    [attr.height]="CONTAINER_HEIGHT"
                    [attr.viewBox]="'0 0 ' + CONTAINER_WIDTH + ' ' + CONTAINER_HEIGHT">

                    @for (pencil of leftPencils; track $index) {
                    @if (!pencil.isPaired) {
                    <circle
                        [attr.cx]="LEFT_ANCHOR_X"
                        [attr.cy]="getItemCenterY($index)"
                        r="5"
                        [attr.fill]="pencil.isSelected ? '#6366f1' : '#cbd5e1'" />
                    }
                    }

                    @for (pencil of rightPencils; track $index) {
                    @if (!pencil.isPaired) {
                    <circle
                        [attr.cx]="RIGHT_ANCHOR_X"
                        [attr.cy]="getItemCenterY($index)"
                        r="5"
                        fill="#cbd5e1" />
                    }
                    }

                    @for (line of matchLines; track $index) {
                    <line
                        [attr.x1]="LEFT_ANCHOR_X"
                        [attr.y1]="getItemCenterY(line.leftIndex)"
                        [attr.x2]="RIGHT_ANCHOR_X"
                        [attr.y2]="getItemCenterY(line.rightIndex)"
                        stroke="#6366f1"
                        stroke-width="4"
                        stroke-linecap="round"
                        class="match-line" />
                    }
                </svg>

                <!-- Right column: pencils face left (flipped) -->
                <div class="pencil-col right-col">
                    @for (pencil of rightPencils; track $index) {
                    <div class="pencil-slot"
                        [class.matched]="pencil.isPaired"
                        [class.ready]="selectedLeftIndex !== null && !pencil.isPaired"
                        (click)="selectRight($index)">
                        <div [class]="'pencil pencil-' + pencil.color + ' size-' + pencil.size + ' flipped'">
                            <div class="p-eraser"></div>
                            <div class="p-band"></div>
                            <div class="p-body"></div>
                            <div class="p-point"></div>
                        </div>
                    </div>
                    }
                </div>

            </div>
        </div>

        <button class="nav-btn" [class.locked]="!isSubmitted" [disabled]="!isSubmitted" (click)="goNext()"
            aria-label="Sonraki etkinlik">
            <span class="material-icons">arrow_forward</span>
        </button>
    </div>

    <div class="frame-bottom">
        <app-action-buttons [isCompleted]="isSubmitted" (reset)="clearSelection()" (check)="checkAnswer()" />
    </div>
</div>
