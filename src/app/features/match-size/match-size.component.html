<div class="page-frame">
        <div class="frame-top">
        <app-activity-header icons="👧" instruction="Görseldeki kızın aynı büyüklükteki eşini bulun."></app-activity-header>
    </div>

    <div class="frame-middle">
        <button class="nav-btn" (click)="goPrev()" aria-label="Önceki etkinlik">
            <span class="material-icons">arrow_back</span>
        </button>

        <div class="game-content">
            <!-- TARGET BOX (Left Side) -->
            <div class="target-area">
                <div class="target-box">
                    <img src="girl.png" alt="Kız Çocuğu Hedef" [style.width.px]="targetWidth" />
                </div>
            </div>

            <!-- OPTIONS (Right Side) -->
            <div class="options-area">
                @for (opt of options; track opt.id) {
                <div class="option-wrapper">
                    <!-- Transparan tıklanabilir resim wrapper'ı -->
                    <div class="image-wrapper hover" [class.selected]="opt.isSelected" [class.shake]="opt.isShaking"
                        [class.hint]="showHint && opt.isCorrect && !opt.isSelected" role="button" tabindex="0"
                        (click)="selectOption(opt.id)" (keydown.enter)="selectOption(opt.id)"
                        [attr.aria-label]="'Seçenek ' + opt.id">
                        <img src="girl.png" alt="Kız Çocuğu Seçenek" [style.width.px]="opt.width" />
                    </div>

                    <!-- Mini Checkbox Indicator -->
                    <div class="check-box" (click)="selectOption(opt.id)" [class.checked]="opt.isSelected">
                        <span class="material-icons" *ngIf="opt.isSelected">check</span>
                    </div>
                </div>
                }
            </div>
        </div>

        <button class="nav-btn" [class.locked]="!isNextUnlocked" [disabled]="!isNextUnlocked" (click)="goNext()"
            aria-label="Sonraki etkinlik">
            <span class="material-icons">arrow_forward</span>
        </button>
    </div>

    <div class="frame-bottom">
        <app-action-buttons [isCompleted]="isNextUnlocked" (reset)="clearSelection()" (check)="checkAnswer()" />
    </div>
</div>
