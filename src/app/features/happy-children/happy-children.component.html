<div class="page-frame">

        <div class="frame-top">
        <app-activity-header icons="😊" instruction="Hangi ifadeler mutludur? İşaretleyin."></app-activity-header>
    </div>

    <div class="frame-middle">

        <button class="nav-btn" (click)="goPrev()" aria-label="Önceki etkinlik">
            <span class="material-icons">arrow_back</span>
        </button>

        <div class="game-content">
            <div class="interaction-card">
                <div class="children-grid">
                    @for (child of options; track child.id) {
                    <div class="child-card" [class.selected]="isSelected(child.id)"
                        [class.hint-add]="isHintCorrect(child.id)" [class.hint-remove]="isHintWrong(child.id)"
                        (click)="toggleChild(child.id)">

                        <div class="face-container" [attr.data-mood]="child.mood">
                            <span class="face-emoji">{{ child.emoji }}</span>
                        </div>

                        <div class="checkbox" [class.selected]="isSelected(child.id)">
                            @if (isSelected(child.id)) {
                            <span class="material-icons check-icon">check</span>
                            }
                        </div>
                    </div>
                    }
                </div>
            </div>
        </div>

        <button class="nav-btn" [class.locked]="!isNextUnlocked" [disabled]="!isNextUnlocked" (click)="goNext()"
            aria-label="Sonraki etkinlik">
            <span class="material-icons">arrow_forward</span>
        </button>

    </div>

    <div class="frame-bottom">
        <app-action-buttons [isCompleted]="isNextUnlocked" (reset)="clearSelections()" (check)="checkAnswers()" />
    </div>

</div>
