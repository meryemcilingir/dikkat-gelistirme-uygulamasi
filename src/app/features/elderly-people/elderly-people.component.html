<div class="page-frame">

    <div class="frame-top">
    <app-activity-header icons="👴 👵 🧓" instruction="Aşağıdaki insanlardan hangileri yaşlıdır? Altındaki kutucuğu işaretleyin."></app-activity-header>
  </div>

  <div class="frame-middle">

        <button class="nav-btn" (click)="goPrev()" aria-label="Önceki etkinlik">
            <span class="material-icons">arrow_back</span>
        </button>

        <div class="game-content">
            <div class="interaction-card">
                <div class="rows-container">
                    @for (row of rows; track row.id; let rIdx = $index) {
                    <div class="person-row">
                        @for (person of row.people; track person.id; let cIdx = $index) {
                        <div class="person-card" [class.selected]="person.selected"
                            [class.hint-add]="isHintAdd(rIdx, cIdx)" [class.hint-remove]="isHintRemove(rIdx, cIdx)"
                            (click)="togglePerson(rIdx, cIdx)">
                            <div class="person-emoji">{{ person.emoji }}</div>

                            <div class="checkbox" [class.selected]="person.selected">
                                @if (person.selected) {
                                <span class="material-icons check-icon">check</span>
                                }
                            </div>
                        </div>
                        }
                    </div>
                    }
                </div>
            </div>
        </div>

        <button class="nav-btn" [class.locked]="!isNextUnlocked" [disabled]="!isNextUnlocked" (click)="goNext()"
            [attr.aria-label]="isNextUnlocked ? 'Sonraki etkinlik' : 'Önce doğru cevapları bulmalısınız'">
            <span class="material-icons">arrow_forward</span>
        </button>

    </div>

    <div class="frame-bottom">
        <app-action-buttons [isCompleted]="isNextUnlocked" (reset)="clearSelections()" (check)="checkAnswers()" />
    </div>

</div>
