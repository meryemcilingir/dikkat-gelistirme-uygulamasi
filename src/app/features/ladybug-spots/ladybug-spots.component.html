<div class="page-frame">

    <div class="frame-top">
        <app-activity-header icons="🐞" instruction="Uğur böceğinin kaç beneği olduğunu bulun ve işaretleyin."></app-activity-header>
    </div>

    <div class="frame-middle">

        <button class="nav-btn" (click)="prev()" aria-label="Önceki etkinlik">
            <span class="material-icons">arrow_back</span>
        </button>

        <div class="game-content">
            <div class="ladybug-layout">
                
                <!-- Ladybug Visual -->
                <div class="ladybug-container">
                    <div class="ladybug">
                        <div class="head">
                            <div class="antenna left"></div>
                            <div class="antenna right"></div>
                            <div class="eye left"></div>
                            <div class="eye right"></div>
                        </div>
                        <div class="body">
                            <!-- Left Wing Spots (4 spots) -->
                            <div class="spot s1"></div>
                            <div class="spot s2"></div>
                            <div class="spot s3"></div>
                            <div class="spot s4"></div>
                            <!-- Right Wing Spots (3 spots) -->
                            <div class="spot s5"></div>
                            <div class="spot s6"></div>
                            <div class="spot s7"></div>
                            <div class="body-split"></div>
                        </div>
                    </div>
                </div>

                <!-- Number Options -->
                <div class="options-container">
                    @for (option of options; track option.id) {
                        <div class="number-card" 
                             [class.selected]="selectedOptionId === option.id"
                             [class.hint-pulse]="isHintPulse(option.id)"
                             [class.shake]="option.isShaking"
                             (click)="selectOption(option.id)">
                            <span class="number-text">{{ option.text }}</span>
                        </div>
                    }
                </div>

            </div>
        </div>

        <button class="nav-btn" [class.locked]="!isNextUnlocked" [disabled]="!isNextUnlocked" (click)="next()"
            aria-label="Sonraki etkinlik">
            <span class="material-icons">arrow_forward</span>
        </button>

    </div>

    <div class="frame-bottom">
        <app-action-buttons [isCompleted]="isNextUnlocked" (reset)="onReset()" (check)="onCheck()" />
    </div>

</div>

<app-shared-feedback></app-shared-feedback>
