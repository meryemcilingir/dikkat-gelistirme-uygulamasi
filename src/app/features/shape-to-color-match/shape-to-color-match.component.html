<div class="page-frame">

    <!-- ── Yönerge ─────────────────────────── -->
        <div class="frame-top">
        <app-activity-header icons="🟥" instruction="Kareleri kırmızıya, üçgenleri sarıya boyayın. Nasıl bir görüntü çıkar? Aşağıdan bulun."></app-activity-header>
    </div>

    <!-- ── Oyun Alanı ─────────────────────────── -->
    <div class="frame-middle">

        <button class="nav-btn" (click)="goPrev()" aria-label="Önceki etkinlik">
            <span class="material-icons">arrow_back</span>
        </button>

        <div class="game-content">

            <!-- Üst - Referans Matrisi -->
            <div class="reference-container">
                <div class="reference-matrix" aria-label="Boş şekil matrisi">
                    @for (shape of referenceGrid; track $index) {
                    <div class="matrix-cell">
                        <div class="outline-shape" [ngClass]="shape"></div>
                    </div>
                    }
                </div>
            </div>

            <div class="divider">
                <span class="material-icons arrow-down">arrow_downward</span>
            </div>

            <!-- Alt - Seçenekler Alanı -->
            <div class="options-container">
                @for (opt of options; track opt.id) {
                <button class="option-card hover" [class.selected]="selectedId === opt.id" [class.shake]="opt.isShaking"
                    [class.hint]="showHint && opt.isCorrect && selectedId === null" (click)="selectOption(opt.id)"
                    [attr.aria-label]="'Renk dizilimi seçeneği ' + opt.id" [attr.aria-pressed]="selectedId === opt.id">

                    <!-- 3x3 Renk Grid'i -->
                    <div class="color-grid">
                        @for (color of opt.colors; track $index) {
                        <div class="color-circle" [ngClass]="color"></div>
                        }
                    </div>
                </button>
                }
            </div>

        </div>

        <button class="nav-btn" [class.locked]="!isNextUnlocked" [disabled]="!isNextUnlocked" (click)="goNext()"
            aria-label="Sonraki etkinlik">
            <span class="material-icons">arrow_forward</span>
        </button>

    </div>

    <!-- ── Butonlar + Geri Bildirim ─────────── -->
    <div class="frame-bottom">
        <app-action-buttons [isCompleted]="isNextUnlocked" (reset)="clearSelection()"
            (check)="checkAnswer()"></app-action-buttons>
    </div>

</div>
