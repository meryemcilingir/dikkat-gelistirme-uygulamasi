<div class="page-frame">
    <div class="frame-top">
        <app-activity-header icons="🍎"
            instruction="Meyvelerin sayıları artarak devam ettiğine göre, işaretli olan yere kaç meyve gelmelidir?">
        </app-activity-header>
    </div>

    <div class="frame-middle">
        <button class="nav-btn" (click)="goPrev()" aria-label="Önceki etkinlik">
            <span class="material-icons">arrow_back</span>
        </button>

        <div class="game-content">
            <div class="boxes-grid">
                @for (box of boxes; track box.id) {
                    @if (box.isQuestion) {
                        <div class="fruit-box question-box" [class.shake]="isShaking">
                            <div class="question-mark">?</div>
                            <div class="input-wrapper">
                                @if (showHint && feedbackState !== 'correct') {
                                    <span class="ghost-answer">5</span>
                                }
                                <input
                                    type="text"
                                    inputmode="numeric"
                                    pattern="[0-9]*"
                                    maxlength="2"
                                    class="count-input"
                                    [class.input-correct]="feedbackState === 'correct'"
                                    [(ngModel)]="userInput"
                                    (ngModelChange)="onInput()"
                                    [disabled]="isNextUnlocked"
                                    [placeholder]="showHint ? '' : '?'" />
                            </div>
                        </div>
                    } @else {
                        <div class="fruit-box">
                            <div class="fruits-area">
                                @for (fruit of box.fruits; track $index) {
                                    <ng-container *ngTemplateOutlet="fruitTpl; context: { k: fruit }"></ng-container>
                                }
                            </div>
                        </div>
                    }
                }
            </div>
        </div>

        <button class="nav-btn" [class.locked]="!isNextUnlocked" [disabled]="!isNextUnlocked"
            (click)="goNext()" aria-label="Sonraki etkinlik">
            <span class="material-icons">arrow_forward</span>
        </button>
    </div>

    <div class="frame-bottom">
        <app-action-buttons [isCompleted]="isNextUnlocked" (reset)="clearSelection()" (check)="checkAnswer()" />
    </div>
</div>

<ng-template #fruitTpl let-k="k">
    <svg class="fruit-svg" viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg">
        @switch (k) {

        @case ('apple') {
        <!-- Elma: kırmızı daire + yeşil yaprak + çubuk -->
        <circle cx="18" cy="20" r="14" fill="#e53935" stroke="#b71c1c" stroke-width="1.5"/>
        <path d="M 18 6 Q 22 2 26 4" fill="none" stroke="#388e3c" stroke-width="2" stroke-linecap="round"/>
        <rect x="17" y="4" width="2" height="5" rx="1" fill="#5d4037"/>
        }

        @case ('banana') {
        <!-- Muz: sarı yay şekli -->
        <path d="M 6 28 Q 10 10 26 8 Q 30 16 22 26 Q 14 30 6 28 Z"
              fill="#fdd835" stroke="#f9a825" stroke-width="1.5"/>
        <path d="M 6 28 Q 10 10 26 8" fill="none" stroke="#f57f17" stroke-width="1" stroke-linecap="round"/>
        }

        @case ('cherry') {
        <!-- Kiraz: iki koyu kırmızı daire + yeşil saplar -->
        <path d="M 12 14 Q 18 4 24 14" fill="none" stroke="#388e3c" stroke-width="2" stroke-linecap="round"/>
        <circle cx="10" cy="22" r="7" fill="#c62828" stroke="#7f0000" stroke-width="1.5"/>
        <circle cx="26" cy="22" r="7" fill="#c62828" stroke="#7f0000" stroke-width="1.5"/>
        }

        }
    </svg>
</ng-template>
