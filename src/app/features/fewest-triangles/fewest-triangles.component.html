<div class="page-frame">

  <div class="frame-top">
    <app-activity-header
      [instruction]="'En az üçgenin bulunduğu kutuyu işaretleyin.'"
      [icons]="'🔺📦'">
    </app-activity-header>
  </div>

  <div class="frame-middle">
    <button class="nav-btn" (click)="prev()">&#9664;</button>

    <div class="game-content">
      <div class="boxes-grid">
        @for (box of boxes; track box.id) {
          <div class="triangle-box"
               [class.selected]="selectedId === box.id"
               [class.correct]="isCompleted && selectedId === box.id && box.id === correctId"
               (click)="selectBox(box.id)">
            <div class="triangles-area">
              @for (i of getArray(box.count); track i) {
                <div class="mini-triangle" [style.border-bottom-color]="box.color"></div>
              }
            </div>
          </div>
        }
      </div>
    </div>

    <button class="nav-btn" [class.locked]="!isCompleted" (click)="next()">&#9654;</button>
  </div>

  <div class="frame-bottom">
    <app-action-buttons
      [isCompleted]="isCompleted"
      (reset)="onReset()"
      (check)="onCheck()">
    </app-action-buttons>
  </div>

</div>

<app-shared-feedback></app-shared-feedback>
