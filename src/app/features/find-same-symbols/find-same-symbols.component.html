<div class="page-frame">
        <div class="frame-top">
        <app-activity-header icons="🅱️" instruction="Şeklin aynısı olanları seçin."></app-activity-header>
    </div>

    <div class="frame-middle">
        <button class="nav-btn" (click)="goPrev()" aria-label="Önceki etkinlik">
            <span class="material-icons">arrow_back</span>
        </button>

        <div class="game-content">
            <!-- Left Side / Target Container -->
            <div class="target-container">
                <div class="target-box">
                    <span class="symbol-letter">B</span>
                </div>
            </div>

            <!-- Right Side / Options Grid -->
            <div class="options-container">
                @for (opt of options; track opt.id) {
                <!-- Interactive Option Card -->
                <div class="option-card hover" [class.selected]="isSelected(opt.id)" [class.shake]="showHints && opt.isShaking"
                    [class.hint]="isHint(opt)" role="button" tabindex="0" (click)="toggleSelection(opt.id)"
                    (keydown.enter)="toggleSelection(opt.id)"
                    [attr.aria-label]="opt.letter + ' Şekli Seçenek ' + opt.id"
                    [attr.aria-pressed]="isSelected(opt.id)">

                    <span class="symbol-letter" [ngClass]="opt.cssClass">{{ opt.letter }}</span>
                </div>
                }
            </div>
        </div>

        <button class="nav-btn" [class.locked]="!isNextUnlocked" [disabled]="!isNextUnlocked" (click)="goNext()"
            aria-label="Sonraki etkinlik">
            <span class="material-icons">arrow_forward</span>
        </button>
    </div>

    <div class="frame-bottom">
        <app-action-buttons [isCompleted]="isNextUnlocked" (reset)="clearSelection()" (check)="checkAnswer()" />
    </div>
</div>
