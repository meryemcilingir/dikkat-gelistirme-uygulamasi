<div class="page-frame">

  <!-- ÜSTTE: ActivityHeader bileşeni -->
  <div class="frame-top">
    <app-activity-header
      [instruction]="'Hangisi doktora uygundur?'"
      [icons]="'👩‍⚕️🩺'">
    </app-activity-header>
  </div>

  <!-- ORTADA: Oyun içeriği + navigasyon okları -->
  <div class="frame-middle">
    <button class="nav-btn" (click)="prev()">&#9664;</button>

    <div class="game-content">
      <div class="options-container">
        @for (option of options; track option.id) {
          <div class="option-card"
               [class.selected]="selectedId === option.id"
               [class.shake]="option.isShaking"
               [class.locked]="isCompleted"
               (click)="selectOption(option.id)">
            <div class="icon-circle">
              <span class="emoji">{{ option.emoji }}</span>
            </div>
            <!-- No label text -->
            <div class="select-indicator">
              <div class="dot" *ngIf="selectedId === option.id"></div>
            </div>
          </div>
        }
      </div>
    </div>

    <button class="nav-btn" [class.locked]="!isCompleted" (click)="next()">&#9654;</button>
  </div>

  <!-- ALTTA: ActionButtons bileşeni -->
  <div class="frame-bottom">
    <app-action-buttons
      [isCompleted]="isCompleted"
      [checkAlwaysDisabled]="checkAlwaysDisabled"
      (reset)="onReset()"
      (check)="onCheck()">
    </app-action-buttons>
  </div>

</div>

<!-- Feedback popup — her sayfada olmalı -->
<app-shared-feedback></app-shared-feedback>
