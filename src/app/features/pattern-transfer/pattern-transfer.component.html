<div class="page-frame">

    <div class="frame-top">
        <app-activity-header icons="🔴" instruction="Soldaki deseni aynen sağdaki tabloya geçirin."></app-activity-header>
    </div>

    <div class="frame-middle">

        <button class="nav-btn" (click)="prev()" aria-label="Önceki etkinlik">
            <span class="material-icons">arrow_back</span>
        </button>

        <div class="game-content">
            <div class="transfer-layout">
                
                <!-- Target Grid -->
                <div class="grid-container">
                    <div class="grid 3x3">
                        @for (cell of targetGrid; track $index) {
                            <div class="circle" [class.red]="cell"></div>
                        }
                    </div>
                </div>

                <div class="arrow-indicator">
                    <span class="material-icons">arrow_forward</span>
                </div>

                <!-- User Grid -->
                <div class="grid-container interactive">
                    <div class="grid 3x3">
                        @for (cell of userGrid; track $index) {
                            <div class="circle interactive-circle" 
                                 [class.red]="cell"
                                 [class.hint-pulse]="isHintPulse($index)"
                                 (click)="toggleCell($index)">
                            </div>
                        }
                    </div>
                </div>

            </div>
        </div>

        <button class="nav-btn" [class.locked]="!isNextUnlocked" [disabled]="!isNextUnlocked" (click)="next()"
            aria-label="Sonraki etkinlik">
            <span class="material-icons">arrow_forward</span>
        </button>

    </div>

    <div class="frame-bottom">
        <app-action-buttons [isCompleted]="isNextUnlocked" (reset)="onReset()" (check)="onCheck()" />
    </div>

</div>

<app-shared-feedback></app-shared-feedback>
