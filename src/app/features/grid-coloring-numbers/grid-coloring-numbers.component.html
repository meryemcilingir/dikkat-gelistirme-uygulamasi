<div class="page-frame">

    <div class="frame-top">
        <app-activity-header icons="🎨 🔢 📦"
            instruction="Tablodaki rakamların kutusunu belirtilen renklere boyayın."></app-activity-header>
    </div>

    <div class="frame-middle">

        <button class="nav-btn" (click)="goPrev()" aria-label="Önceki etkinlik">
            <span class="material-icons">arrow_back</span>
        </button>

        <div class="game-content">
            <div class="grid-activity-container">
                
                <!-- The Grid -->
                <div class="color-grid">
                    @for (row of grid; track $index) {
                        <div class="grid-row">
                            @for (cell of row; track cell.col) {
                                <div class="grid-cell" 
                                     [class.empty]="cell.correctNumber === null"
                                     [class.interactive]="cell.correctNumber !== null"
                                     [class.wrong]="feedbackState === 'wrong' && cell.userColorId !== null"
                                     [ngStyle]="getCellStyles(cell)"
                                     (click)="paintCell(cell)">
                                    @if (cell.correctNumber !== null && cell.userColorId === null) {
                                        <span class="cell-number">{{ cell.correctNumber }}</span>
                                    }
                                </div>
                            }
                        </div>
                    }
                </div>

                <!-- Legend / Buttons -->
                <div class="color-legend">
                    @for (key of colorKeys; track key.id) {
                        <button class="color-btn" 
                                [class.active]="selectedColorId === key.id"
                                [style.border-color]="key.color"
                                (click)="selectColor(key.id)">
                            <div class="color-box" [style.background-color]="key.color">
                                {{ key.label }}
                            </div>
                        </button>
                    }
                </div>

            </div>
        </div>

        <button class="nav-btn" [class.locked]="!isNextUnlocked" [disabled]="!isNextUnlocked" (click)="goNext()"
            aria-label="Sonraki etkinlik">
            <span class="material-icons">arrow_forward</span>
        </button>

    </div>

    <div class="frame-bottom">
        <app-action-buttons [isCompleted]="isNextUnlocked" (reset)="restartActivity()" (check)="checkAnswer()" />
    </div>

</div>

<app-shared-feedback></app-shared-feedback>
