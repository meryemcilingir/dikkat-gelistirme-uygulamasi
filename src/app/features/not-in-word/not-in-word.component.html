<div class="page-frame">

    <!-- ── Yönerge (sabit 80px) ─────────────────────────── -->
    <div class="frame-top">
    <app-activity-header icons="🧠 💡 🧩" instruction="&quot;{{targetWord}}&quot; kelimesinin içinde olmayan harfleri aşağıda bulup seçin."></app-activity-header>
  </div>

  <div class="frame-middle">

        <!-- Sol Ok -->
        <button class="nav-btn" (click)="goPrev()" aria-label="Önceki etkinlik">
            <span class="material-icons">arrow_back</span>
        </button>

        <!-- Oyun İçeriği -->
        <div class="game-content">
            <div class="interaction-card">
                <div class="letter-grid">
                    @for (letter of letters; track letter.id) {
                    <button class="letter-btn" [class.selected]="letter.isSelected"
                        [class.hint-add]="isHintAdd(letter.id)" [class.hint-remove]="isHintRemove(letter.id)"
                        (click)="toggleLetter(letter.id)" [style.color]="letter.color"
                        [attr.aria-label]="letter.char + ' harfini seç'">
                        {{letter.char}}
                    </button>
                    }
                </div>
            </div>
        </div>

        <!-- Sağ Ok -->
        <button class="nav-btn" [class.locked]="!isNextUnlocked" [disabled]="!isNextUnlocked" (click)="goNext()"
            [attr.aria-label]="isNextUnlocked ? 'Sonraki etkinlik' : 'Önce harfleri doğru şekilde seçmelisiniz'">
            <span class="material-icons">arrow_forward</span>
        </button>

    </div>

    <!-- ── Butonlar + Geri Bildirim (sabit 120px) ─────────── -->
    <div class="frame-bottom">
        <app-action-buttons [isCompleted]="isNextUnlocked" (reset)="clearSelections()" (check)="checkPattern()" />
    </div>

</div>
