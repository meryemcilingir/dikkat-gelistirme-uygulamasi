<div class="page-frame">

  <div class="frame-top">
    <app-activity-header
      [instruction]="'Cümleleri uygun nesnelerle eşleştirin.'"
      [icons]="'🚲'">
    </app-activity-header>
  </div>

  <div class="frame-middle">
    <button class="nav-btn" (click)="prev()">&#9664;</button>

    <div class="game-content">
      <div class="match-columns">
        <div class="column children-column">
          @for (child of children; track child.id) {
            <div class="item-card"
                 [style.borderColor]="child.color"
                 [class.selected]="selectedChildId === child.id"
                 [class.matched]="child.assignedPairId !== null"
                 (click)="selectChild(child.id)">
              <div class="item-icon" [style.color]="child.color" *ngIf="child.emoji">{{ child.emoji }}</div>
              <div class="item-label text-only">{{ child.label }}</div>
              @if (getPartnerLabel(child); as partner) {
                <div class="linked-partner">&rarr; {{ partner }}</div>
              }
            </div>
          }
        </div>

        <div class="match-divider">
          <span>&harr;</span>
        </div>

        <div class="column bicycles-column">
          @for (bike of bicycles; track bike.id) {
            <div class="item-card"
                 [style.borderColor]="bike.color"
                 [class.selected]="selectedBicycleId === bike.id"
                 [class.matched]="bike.assignedPairId !== null"
                 (click)="selectBicycle(bike.id)">
              <div class="item-icon" [style.color]="bike.color">{{ bike.emoji }}</div>
              @if (getPartnerLabel(bike); as partner) {
                <div class="linked-partner">&rarr; {{ partner }}</div>
              }
            </div>
          }
        </div>
      </div>
    </div>

    <button class="nav-btn" [class.locked]="!isCompleted" (click)="next()">&#9654;</button>
  </div>

  <div class="frame-bottom">
    <app-action-buttons
      [isCompleted]="isCompleted"
      [checkAlwaysDisabled]="checkAlwaysDisabled"
      (reset)="onReset()"
      (check)="onCheck()">
    </app-action-buttons>
  </div>

</div>

<app-shared-feedback></app-shared-feedback>
